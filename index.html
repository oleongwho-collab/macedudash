<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>澳門教育資源決策儀錶板</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>

<body>

<div class="container">

    <header>
        <h1>澳門少子化下教育資源決策儀錶板</h1>
        <p>概念展示版｜模型預測及模擬數據</p>
    </header>

    <section class="notice">
        本Dashboard為概念展示版，部分學校、校舍、成本及教師資料為模擬數據，
        不代表官方統計或正式政策建議。
    </section>

    <section class="panel">
        <h2>情景參數設定</h2>

        <div class="input-grid">

            <label>
                新生兒年變化率（%）
                <input id="birthRate" type="number" value="-8" step="0.5">
            </label>

            <label>
                外來／跨境學生年增長率（%）
                <input id="externalRate" type="number" value="1" step="0.5">
            </label>

            <label>
                學生轉出率（%）
                <input id="transferRate" type="number" value="1.5" step="0.5">
            </label>

            <label>
                目標每班學生人數
                <input id="classSize" type="number" value="28" min="20" max="40">
            </label>

            <label>
                預測年數
                <input id="forecastYears" type="number" value="5" min="1" max="10">
            </label>

        </div>

        <button onclick="runDashboard()">重新計算</button>
    </section>

    <section class="kpi-grid">

        <div class="kpi-card">
            <div class="kpi-title">目前新生兒</div>
            <div id="latestBirth" class="kpi-value">2,870</div>
        </div>

        <div class="kpi-card">
            <div class="kpi-title">目前學生人數</div>
            <div id="currentStudents" class="kpi-value">88,135</div>
        </div>

        <div class="kpi-card">
            <div class="kpi-title">預測期末學生人數</div>
            <div id="futureStudents" class="kpi-value">-</div>
        </div>

        <div class="kpi-card">
            <div class="kpi-title">學生變化率</div>
            <div id="studentChange" class="kpi-value">-</div>
        </div>

        <div class="kpi-card">
            <div class="kpi-title">目前估算班數</div>
            <div id="currentClasses" class="kpi-value">-</div>
        </div>

        <div class="kpi-card">
            <div class="kpi-title">預測班級變化</div>
            <div id="classChange" class="kpi-value">-</div>
        </div>

    </section>

    <section class="chart-grid">

        <div class="panel">
            <h2>學生人數預測</h2>
            <div id="studentChart"></div>
        </div>

        <div class="panel">
            <h2>新生兒趨勢</h2>
            <div id="birthChart"></div>
        </div>

    </section>

    <section class="panel">

        <h2>減班優化判斷</h2>

        <div id="policyResult" class="result-box">
            請按「重新計算」
        </div>

        <table>
            <thead>
                <tr>
                    <th>評估項目</th>
                    <th>數值</th>
                    <th>判斷</th>
                </tr>
            </thead>

            <tbody id="assessmentTable"></tbody>
        </table>

    </section>

    <footer>
        澳門教育資源監測及政策情景模擬儀錶板｜概念展示版
    </footer>

</div>

<script src="app.js"></script>

</body>
</html>
